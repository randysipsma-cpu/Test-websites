<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winkelwagen | FORMA3D</title><style>body{font:16px system-ui;background:#f7f4ef;color:#28372d;margin:0}header{padding:22px 5%;border-bottom:1px solid #ddd}a{color:#284637}main{max-width:820px;margin:35px auto;padding:0 20px}article{background:#fff;border:1px solid #e3dfd8;border-radius:15px;padding:18px;margin:12px 0}article h2{font-size:19px;margin:0 0 6px}.details{color:#667268;font-size:14px;overflow-wrap:anywhere}.line{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:12px}button{font:inherit;border:1px solid #c5c9c3;background:white;border-radius:9px;padding:8px 13px;cursor:pointer}button:disabled{opacity:.5}input{width:58px;font:inherit;padding:8px;border-radius:8px;border:1px solid #ccc}.total{display:flex;justify-content:space-between;font-size:24px;font-weight:800;padding:20px 4px}.notice{background:#ecebe3;padding:16px;border-radius:12px}.empty{padding:28px;background:white;border-radius:14px}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}</style></head><body><header><a href="../">← FORMA3D webshop</a></header><main><h1>Jouw winkelwagen</h1><div id="items"></div><div class="total"><span>Totaal</span><span id="total">€ 0,00</span></div><div class="actions"><a href="../">Verder winkelen</a><button id="clear">Winkelwagen leegmaken</button></div><p class="notice">Dit is een testwebshop. Je winkelwagen wordt alleen op dit apparaat opgeslagen. Bestellen en betalen zijn nog niet actief.</p></main><script src="../cart.js"></script><script>const euro=n=>new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR"}).format(n);const $=id=>document.getElementById(id);function render(){const cart=FORMA3D_CART.read();$("items").replaceChildren();for(const [i,p] of cart.entries()){const art=document.createElement("article"),h=document.createElement("h2");h.textContent=p.name;art.append(h);const detail=document.createElement("div");detail.className="details";detail.textContent=Object.entries(p.options||{}).map(([k,v])=>k+": "+(Array.isArray(v)?v.join(", "):v)).join(" · ");art.append(detail);const line=document.createElement("div");line.className="line";const price=document.createElement("strong");price.textContent=euro(p.unitPrice*p.quantity);const controls=document.createElement("div");const qty=document.createElement("input");qty.type="number";qty.min=1;qty.max=99;qty.value=p.quantity;qty.setAttribute("aria-label","Aantal "+p.name);qty.onchange=()=>{const list=FORMA3D_CART.read();list[i].quantity=Math.max(1,Math.min(99,Math.floor(Number(qty.value)||1)));localStorage.setItem(FORMA3D_CART.key,JSON.stringify(list));render()};const remove=document.createElement("button");remove.textContent="Verwijder";remove.onclick=()=>{const list=FORMA3D_CART.read();list.splice(i,1);localStorage.setItem(FORMA3D_CART.key,JSON.stringify(list));render()};controls.append(qty," ",remove);line.append(controls,price);art.append(line);$("items").append(art)}if(!cart.length){const p=document.createElement("p");p.className="empty";p.textContent="Je winkelwagen is nog leeg."; $("items").append(p)}$("total").textContent=euro(cart.reduce((s,p)=>s+p.unitPrice*p.quantity,0));$("clear").disabled=!cart.length}$("clear").onclick=()=>{if(confirm("Winkelwagen leegmaken?")){localStorage.removeItem(FORMA3D_CART.key);render()}};render()</script></body></html>
