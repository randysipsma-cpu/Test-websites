<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMA3D | Kleuren beheren</title><style>:root{font-family:system-ui,sans-serif;color:#243b30;background:#f6f3ed}*{box-sizing:border-box}body{margin:0}header{background:#243b30;color:white;padding:20px}header a{color:white}main{max-width:900px;margin:auto;padding:24px}h1{font-size:clamp(28px,5vw,44px)}.warning{background:#fff0d1;padding:16px;border-radius:12px;line-height:1.5}.panel{background:white;padding:20px;border-radius:18px;margin:18px 0}.colorRow{display:grid;grid-template-columns:55px 1fr 100px 45px;gap:10px;align-items:center;margin:10px 0}.colorRow input{width:100%;min-width:0;padding:9px;border:1px solid #cdd5cd;border-radius:8px;font:inherit}.colorRow input[type=color]{height:43px;padding:3px}.colorRow button{border:0;border-radius:8px;padding:10px;background:#fce5e1;color:#873b33;cursor:pointer}.actions{display:flex;flex-wrap:wrap;gap:12px}.actions button,.add{background:#243b30;color:white;border:0;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}.actions button.secondary{background:#e8ebe4;color:#243b30}.add{margin-top:10px}.status{font-weight:700}@media(max-width:600px){.colorRow{grid-template-columns:45px 1fr 40px}.colorRow .hex{display:none}} </style></head><body><header><a href="../">← FORMA3D webshop</a></header><main><h1>Kleuren beheren</h1><p class="warning"><b>Testbeheerpaneel:</b> wijzigingen worden alleen in deze browser opgeslagen. Andere klanten en apparaten zien deze wijzigingen nog niet. Dit scherm is niet beveiligd als productiebeheerpaneel.</p><div id="sections"></div><div class="actions"><button id="save">Wijzigingen opslaan</button><button id="reset" class="secondary">Standaardkleuren herstellen</button><a href="../naam-clicker/">Bekijk klantconfigurator</a></div><p id="status" class="status" role="status"></p></main><script src="../colors.js"></script><script>
let colors=getForma3DColors();const titles={base:"Basiskleuren",letter:"Letterkleuren",click:"Drukknopkleuren"};function render(){const root=document.getElementById("sections");root.replaceChildren();for(const type of ["base","letter","click"]){const section=document.createElement("section");section.className="panel";const title=document.createElement("h2");title.textContent=titles[type];section.append(title);colors[type].forEach((entry,i)=>{const row=document.createElement("div");row.className="colorRow";const picker=document.createElement("input");picker.type="color";picker.value=entry[1];picker.setAttribute("aria-label","Kleur "+entry[0]);const name=document.createElement("input");name.value=entry[0];name.maxLength=35;name.setAttribute("aria-label","Kleurnaam");const hex=document.createElement("input");hex.className="hex";hex.value=entry[1];hex.maxLength=7;hex.setAttribute("aria-label","Hexkleur");const remove=document.createElement("button");remove.textContent="×";remove.setAttribute("aria-label","Verwijder "+entry[0]);name.oninput=()=>colors[type][i][0]=name.value;picker.oninput=()=>{colors[type][i][1]=picker.value;hex.value=picker.value};hex.onchange=()=>{if(/^#[0-9a-fA-F]{6}$/.test(hex.value)){colors[type][i][1]=hex.value;picker.value=hex.value}else hex.value=colors[type][i][1]};remove.onclick=()=>{if(colors[type].length<=1){alert("Laat minimaal één kleur per onderdeel beschikbaar.");return}colors[type].splice(i,1);render()};row.append(picker,name,hex,remove);section.append(row)});const add=document.createElement("button");add.className="add";add.textContent="+ Kleur toevoegen";add.onclick=()=>{colors[type].push(["Nieuwe kleur","#b6b6b6"]);render()};section.append(add);root.append(section)}}document.getElementById("save").onclick=()=>{if(["base","letter","click"].some(k=>colors[k].some(e=>!e[0].trim()))){document.getElementById("status").textContent="Vul alle kleurnamen in.";return}try{localStorage.setItem(FORMA3D_COLORS_KEY,JSON.stringify(colors));document.getElementById("status").textContent="Kleuren opgeslagen op dit apparaat. Open de configurator opnieuw om ze te zien."}catch{document.getElementById("status").textContent="Opslaan mislukt."}};document.getElementById("reset").onclick=()=>{if(!confirm("Standaardkleuren herstellen op dit apparaat?"))return;colors=JSON.parse(JSON.stringify(FORMA3D_DEFAULT_COLORS));localStorage.removeItem(FORMA3D_COLORS_KEY);render();document.getElementById("status").textContent="Standaardkleuren hersteld."};render();
</script></body></html>
