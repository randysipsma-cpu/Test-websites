<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19191f"><title>Mijn Orkestbanden — Cue Board</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#101015;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,.pad:focus-visible{outline:3px solid #16c8e5;outline-offset:1px}.app{height:100dvh;display:flex;flex-direction:column;max-width:1400px;margin:auto;background:linear-gradient(#222228,#121217)}.top{display:flex;align-items:center;gap:8px;min-height:62px;padding:7px 12px;background:linear-gradient(#414148,#24242b);border-bottom:2px solid #0d0d12}.transport{display:flex;gap:2px;flex-shrink:0}.transport button,.toolbar button,.bottom button{background:linear-gradient(#46464e,#292930);color:#d8d8dd;border:1px solid #202027;border-radius:3px;min-width:43px;height:42px;font-size:21px}.transport button:active,.toolbar button:active,.bottom button:active{background:#5d5d66}.now{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}.nowline{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:6px;align-items:center}.clock{font-weight:700;color:#a2d94b;font-size:17px;font-variant-numeric:tabular-nums}.clock:last-child{text-align:right}.song{font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}.progress{width:100%;height:9px;accent-color:#a3d33f;cursor:pointer}.toolbar{display:flex;gap:2px}.toolbar button{font-size:23px}.board{flex:1;min-height:0;padding:12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:9px;overflow:hidden}.pad{position:relative;min-width:0;min-height:0;border:1px solid #66666a;border-radius:5px;background:linear-gradient(#fff 0%,#f5f5f5 73%,#d5d5d7 88%,#9a9a9e 100%);color:#222;box-shadow:0 2px 3px #08080b;text-align:center;display:flex;align-items:center;justify-content:center;padding:18px 5px 13px;font-size:clamp(12px,1.45vw,18px);overflow:hidden;word-break:break-word}.pad .number{position:absolute;top:5px;left:7px;font-size:12px;color:#4e4e54}.pad .name{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.pad.empty{background:linear-gradient(#292931,#222229);border-color:#25252d;box-shadow:inset 0 1px 5px #14141a;color:#777}.pad.empty .number{color:#555}.pad.playing{background:linear-gradient(#19ff00,#0de000 72%,#05a500 90%,#007d00);border-color:#04a300;color:#071d03}.pad.selected:not(.playing){outline:2px solid #16c8e5;outline-offset:-3px}.pad .corner{position:absolute;right:0;top:0;width:0;height:0;border-top:29px solid #15c8e6;border-left:34px solid transparent}.pad .corner:after{content:"➜";position:absolute;top:-28px;right:2px;color:#fff;font-size:14px}.bottom{display:flex;align-items:center;gap:7px;padding:7px 12px;background:linear-gradient(#34343b,#1b1b22);border-top:1px solid #43434a;min-height:53px}.bottom label{font-size:12px;color:#c7c7ca}.bottom input[type=range]{width:110px;accent-color:#ccc}.bottom .seconds{font-size:12px;color:#b8b8c0;width:27px}.pages{display:flex;justify-content:center;gap:3px;flex:1}.pages button{font-size:13px;min-width:57px;height:36px}.pages button.active{background:linear-gradient(#b5b5b8,#6b6b73);color:#111}.mobile-arrows{display:none}.status{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);padding:8px 14px;background:#121219ee;border:1px solid #56565e;border-radius:8px;font-size:12px;max-width:95%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}.status.show{opacity:1}.dialog{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:14px;z-index:5}.dialog.open{display:flex}.sheet{width:min(520px,100%);max-height:88dvh;overflow:auto;background:#292931;border:1px solid #666;border-radius:12px;padding:18px;box-shadow:0 12px 50px #0009}.sheet h2{margin:0 0 14px;font-size:20px}.sheet label{display:block;font-size:13px;margin:11px 0 4px}.sheet input,.sheet select{width:100%;padding:10px;background:#181820;color:white;border:1px solid #595964;border-radius:6px}.sheet .actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}.sheet button{padding:10px 13px;border:1px solid #555;background:#484854;color:white;border-radius:6px}.sheet button.primary{background:#148fba}.sheet button.danger{background:#83343a}.sheet .hint{color:#b4b4be;font-size:12px;line-height:1.5}.file{display:none}
@media(max-width:700px){.top{min-height:92px;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:38px 37px;gap:3px;padding:5px 7px}.transport{grid-column:1/3;grid-row:1}.toolbar{grid-column:3;grid-row:1}.now{grid-column:1/4;grid-row:2}.transport button,.toolbar button{height:35px;min-width:44px;font-size:19px}.clock{font-size:14px}.song{font-size:13px}.progress{height:8px}.board{padding:7px;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:7px}.pad{font-size:clamp(12px,3.4vw,17px);padding:17px 4px 10px}.pad .number{font-size:11px}.bottom{min-height:57px;padding:5px 7px}.bottom .fade-label,.bottom input[type=range],.bottom .seconds,.pages{display:none}.mobile-arrows{display:flex;justify-content:center;gap:12px;flex:1}.mobile-arrows button{min-width:76px;height:43px;font-size:25px}.bottom .pagecount{font-size:12px;color:#ddd}}
</style></head><body><div class="app">
<div class="top"><div class="transport"><button id="stop" title="Stop">■</button><button id="pause" title="Pauze">Ⅱ</button><button id="fade" title="Fade-out">◢</button></div><div class="now"><div class="nowline"><span id="elapsed" class="clock">0:00</span><span id="title" class="song">Geen cue geselecteerd</span><span id="remaining" class="clock">-0:00</span></div><input id="seek" class="progress" type="range" min="0" max="1000" value="0" aria-label="Voortgang"></div><div class="toolbar"><button id="settings" title="Instellingen en setlijsten" aria-label="Instellingen">⚙</button><button id="add" title="Muziek toevoegen">＋</button></div></div>
<main id="board" class="board" aria-label="SoundCue board"></main>
<div class="bottom"><label class="fade-label" for="fadeDuration">Fade</label><input type="range" id="fadeDuration" min="0.5" max="60" step="0.5" value="2"><span id="fadeValue" class="seconds">2.0</span><div class="pages" id="pages"></div><div class="mobile-arrows"><button id="prevPage" aria-label="Vorige pagina">⬆</button><span class="pagecount" id="pageCount"></span><button id="nextPage" aria-label="Volgende pagina">⬇</button></div></div></div>
<div id="status" class="status" role="status"></div><input id="file" class="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac" multiple>
<div id="dialog" class="dialog" role="dialog" aria-modal="true"><div class="sheet"><h2 id="dialogTitle">Instellingen</h2><div id="dialogBody"></div><div class="actions" id="dialogActions"></div></div></div>
<audio id="audio" preload="auto" playsinline webkit-playsinline x-webkit-airplay="allow"></audio>
<script>
'use strict';
const $=id=>document.getElementById(id),audio=$('audio'),MAX=125,STORE='orkestbanden-board-v2';
let slots=Array(MAX).fill(null),page=0,active=-1,selected=-1,fadeTimer=null,fadeValue=2,library=[],setName='Mijn setlijst',setNames={},pendingSlot=-1,toastTimer,playRequest=0,fadeTimeout=null;
const mobile=()=>matchMedia('(max-width:700px)').matches,perPage=()=>mobile()?9:25,maxPage=()=>Math.ceil(MAX/perPage())-1;
const fmt=v=>{v=Math.max(0,Math.floor(Number(v)||0));return Math.floor(v/60)+':'+String(v%60).padStart(2,'0')};
function toast(t){$('status').textContent=t;$('status').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('status').classList.remove('show'),3000)}
const dbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open('orkestbanden-audio',2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('audio'))r.result.createObjectStore('audio')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
async function putBlob(key,blob){const db=await dbPromise;return new Promise((resolve,reject)=>{const tx=db.transaction('audio','readwrite');tx.objectStore('audio').put(blob,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function getBlob(key){const db=await dbPromise;return new Promise((resolve,reject)=>{const req=db.transaction('audio').objectStore('audio').get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function persist(){try{localStorage.setItem(STORE,JSON.stringify({slots:slots.map(s=>s?{name:s.name,key:s.key,volume:s.volume??100,start:s.start??0,end:s.end??null}:null),setName,setNames,fadeValue}));return true}catch(e){toast('Opslaan niet mogelijk: opslagruimte controleren');return false}}
async function hydrate(){for(let i=0;i<MAX;i++){const s=slots[i];if(!s||!s.key||s.url)continue;try{const blob=await getBlob(s.key);if(blob)s.url=URL.createObjectURL(blob)}catch(e){}}render()}
function close(){ $('dialog').classList.remove('open') }
function openDialog(title,content,buttons){$('dialogTitle').textContent=title;$('dialogBody').replaceChildren();$('dialogActions').replaceChildren();$('dialogBody').append(content);buttons.forEach(({label,action,kind})=>{const b=document.createElement('button');b.textContent=label;b.className=kind||'';b.onclick=action;$('dialogActions').append(b)});$('dialog').classList.add('open')}
function el(tag,props={}){const n=document.createElement(tag);Object.entries(props).forEach(([k,v])=>{if(k==='text')n.textContent=v;else if(k==='value')n.value=v;else n.setAttribute(k,v)});return n}
function stop(){playRequest++;clearFade(false);audio.pause();if(Number.isFinite(audio.duration))audio.currentTime=Math.min(slots[active]?.start||0,audio.duration);applyVolume();syncMediaSession();render();updateClock()}
function clearFade(reset=true){$('fade').disabled=false;if(fadeTimer){clearInterval(fadeTimer);fadeTimer=null}if(fadeTimeout){clearTimeout(fadeTimeout);fadeTimeout=null}if(reset)applyVolume()}
function applyVolume(){audio.volume=Math.max(0,Math.min(1,(slots[active]?.volume??100)/100))}
function setupAudio(){/* Keep the HTMLMediaElement connected directly to iOS media playback.
Creating a Web Audio MediaElementSource can interrupt lock-screen/background playback. */applyVolume()}
function syncMediaSession(){if(!('mediaSession' in navigator))return;const cue=slots[active];if(cue&&'MediaMetadata' in window){navigator.mediaSession.metadata=new MediaMetadata({title:cue.name||'Orkestband',artist:'Mijn Orkestbanden',album:setName})}navigator.mediaSession.playbackState=audio.paused?'paused':'playing';if(navigator.mediaSession.setPositionState&&Number.isFinite(audio.duration)&&audio.duration>0){try{navigator.mediaSession.setPositionState({duration:audio.duration,playbackRate:audio.playbackRate,position:Math.max(0,Math.min(audio.currentTime,audio.duration))})}catch(e){}}}
function initMediaSession(){if(!('mediaSession' in navigator))return;const actions={play:()=>{if(active>=0){setupAudio();audio.play().catch(()=>toast('Afspelen mislukt'))}},pause:()=>audio.pause(),stop:stop,seekto:d=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.max(0,Math.min(d.seekTime||0,audio.duration))}};for(const [action,handler]of Object.entries(actions)){try{navigator.mediaSession.setActionHandler(action,handler)}catch(e){}}syncMediaSession()}
async function start(i){const s=slots[i];if(!s){editSlot(i);return}if(!s.url){toast('Audiobestand wordt geladen of ontbreekt');return}if(active===i&&!audio.paused){stop();return}const request=++playRequest;clearFade(false);audio.pause();active=i;selected=i;audio.src=s.url;audio.load();const seekStart=()=>{if(request!==playRequest)return;const target=Math.max(0,Number(s.start)||0);if(target>0&&Number.isFinite(audio.duration)){try{audio.currentTime=Math.min(target,Math.max(0,audio.duration-0.01))}catch(e){}}updateClock()};audio.onloadedmetadata=seekStart;setupAudio();syncMediaSession();try{await audio.play();if(request!==playRequest){audio.pause();return}seekStart();syncMediaSession();render()}catch(e){if(request===playRequest)toast('Afspelen mislukt. Controleer het audiobestand.')}}
function updateClock(){const duration=Number.isFinite(audio.duration)?audio.duration:0;if(active>=0&&slots[active]?.end!=null&&!audio.paused&&audio.currentTime>=slots[active].end){stop();toast('Cue-eindpunt bereikt');return}$('elapsed').textContent=fmt(audio.currentTime);$('remaining').textContent='-'+fmt(Math.max(0,duration-audio.currentTime));$('seek').value=duration?Math.round(audio.currentTime/duration*1000):0;$('title').textContent=slots[active]?.name||'Geen cue geselecteerd'}
function render(){const board=$('board');board.replaceChildren();const count=perPage(),first=page*count;for(let n=0;n<count;n++){const i=first+n;if(i>=MAX)break;const s=slots[i],pad=el('button',{class:'pad'+(!s?' empty':'')+(active===i&&!audio.paused?' playing':'')+(selected===i?' selected':''),'aria-label':'Cue '+(i+1)+(s?' '+s.name:' leeg')});pad.append(el('span',{class:'number',text:String(i+1)}),el('span',{class:'name',text:s?s.name:''}));if(s?.end!=null)pad.append(el('span',{class:'corner'}));let suppressClick=false;pad.onclick=()=>{if(suppressClick){suppressClick=false;return}if(s){if(active===i&&!audio.paused){stop();return}start(i)}else editSlot(i)};pad.oncontextmenu=e=>{e.preventDefault();suppressClick=true;editSlot(i)};let touchTimer;pad.addEventListener('touchstart',()=>{suppressClick=false;touchTimer=setTimeout(()=>{touchTimer=null;suppressClick=true;editSlot(i)},650)},{passive:true});pad.addEventListener('touchend',()=>clearTimeout(touchTimer));pad.addEventListener('touchcancel',()=>{clearTimeout(touchTimer);suppressClick=false});pad.addEventListener('touchmove',()=>clearTimeout(touchTimer));board.append(pad)}const pages=$('pages');pages.replaceChildren();for(let p=0;p<=maxPage();p++){const b=el('button',{text:'Page '+(p+1)});if(p===page)b.className='active';b.onclick=()=>setPage(p);pages.append(b)}$('pageCount').textContent=(page+1)+' / '+(maxPage()+1);updateClock()}
function setPage(p){page=Math.min(maxPage(),Math.max(0,p));render()}
function editSlot(i){selected=i;const s=slots[i],body=el('div');const name=el('input',{type:'text',value:s?.name||'',placeholder:'Naam van de cue'}),vol=el('input',{type:'range',min:'0',max:'100',value:String(s?.volume??100)}),startAt=el('input',{type:'number',min:'0',step:'0.1',value:String(s?.start??0)}),endAt=el('input',{type:'number',min:'0',step:'0.1',placeholder:'Volledige track'}),dest=el('input',{type:'number',min:'1',max:'125',value:String(i+1)});if(s?.end!=null)endAt.value=s.end;
for(const [label,input] of [['Cue-naam',name],['Cue-volume',vol],['Startpositie (seconden)',startAt],['Eindpositie (optioneel)',endAt],['Cue-positie',dest]]){body.append(el('label',{text:label}),input)}
body.append(el('p',{class:'hint',text:'Tik op Audio kiezen om een nummer uit je apparaat toe te wijzen. Houd een cue-knop ingedrukt om deze instellingen te openen.'}));
openDialog('Cue '+(i+1),body,[{label:'Audio kiezen',kind:'primary',action:()=>{pendingSlot=i;$('file').multiple=false;$('file').click();close()}},{label:'Opslaan',action:()=>{const j=Math.min(124,Math.max(0,Number(dest.value||i+1)-1));if(s){s.name=name.value.trim()||s.name;s.volume=Number(vol.value);s.start=Math.max(0,Number(startAt.value)||0);s.end=endAt.value===''?null:Math.max(0,Number(endAt.value));if(j!==i){[slots[i],slots[j]]=[slots[j],slots[i]];if(active===i)active=j;else if(active===j)active=i}if(active===j||active===i)applyVolume();persist()}close();render()}},{label:'Verwijder cue',kind:'danger',action:()=>{if(!slots[i]||confirm('Cue '+(i+1)+' verwijderen?')){if(active===i){stop();audio.removeAttribute('src');active=-1}if(slots[i]?.url)URL.revokeObjectURL(slots[i].url);slots[i]=null;persist();render();close()}}},{label:'Annuleren',action:close}])}
async function importFiles(files,target=-1){let n=0;for(const file of files){if(!file.type.startsWith('audio/')&&!/\.(mp3|wav|m4a|aac)$/i.test(file.name))continue;const i=target>=0?target:slots.findIndex(s=>!s);if(i<0||i>=MAX)break;const key=crypto.randomUUID(),item={name:file.name.replace(/\.[^.]+$/,''),key,url:URL.createObjectURL(file),volume:100,start:0,end:null};try{await putBlob(key,file)}catch(e){toast('Opslag mislukt: audiobestand mogelijk niet blijvend beschikbaar')}if(active===i){stop();audio.removeAttribute('src');active=-1}if(slots[i]?.url)URL.revokeObjectURL(slots[i].url);slots[i]=item;n++;if(target>=0)break}persist();render();toast(n+' audiobestand(en) toegevoegd')}
$('file').onchange=async e=>{const files=Array.from(e.target.files),target=pendingSlot;pendingSlot=-1;e.target.value='';await importFiles(files,target)};
$('add').onclick=()=>{pendingSlot=-1;$('file').multiple=true;$('file').click()};
$('stop').onclick=stop;$('pause').onclick=()=>{if(audio.paused){if(active>=0&&slots[active]?.url){setupAudio();audio.play().catch(()=>toast('Kan niet hervatten'))}}else{clearFade();audio.pause()}render()};
$('fade').onclick=()=>{if(audio.paused)return;clearFade(false);const duration=Math.max(0.5,Number(fadeValue)||2),request=playRequest,startVolume=audio.volume,started=performance.now();$('fade').disabled=true;fadeTimer=setInterval(()=>{if(request!==playRequest||audio.paused){clearFade();return}const progress=Math.min(1,(performance.now()-started)/(duration*1000));audio.volume=Math.max(0,startVolume*(1-progress));if(progress>=1){stop();toast('Fade-out voltooid')}},50);toast('Fade-out gestart: '+duration+' seconden')};
$('seek').oninput=e=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(e.target.value)/1000*audio.duration};
$('fadeDuration').oninput=e=>{fadeValue=Number(e.target.value);$('fadeValue').textContent=fadeValue.toFixed(1);persist()};
$('prevPage').onclick=()=>setPage(page-1);$('nextPage').onclick=()=>setPage(page+1);
audio.ontimeupdate=()=>{updateClock();if(Math.floor(audio.currentTime)%3===0)syncMediaSession()};audio.onloadedmetadata=()=>syncMediaSession();audio.onended=()=>{clearFade();syncMediaSession();render();toast('Cue afgelopen')};audio.onplay=()=>{syncMediaSession();render()};audio.onpause=()=>{syncMediaSession();render()};audio.onerror=()=>toast('Audiobestand niet beschikbaar');document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncMediaSession();updateClock()}});
function settings(){const body=el('div'),name=el('input',{type:'text',value:setName}),choice=el('select'),fadeInput=el('input',{type:'number',min:'0.5',max:'60',step:'0.5',value:String(fadeValue)});choice.append(el('option',{value:'',text:'Kies opgeslagen setlijst'}));Object.keys(setNames).sort().forEach(k=>choice.append(el('option',{value:k,text:k})));body.append(el('label',{text:'Fade-out tijd (seconden)'}),fadeInput,el('p',{class:'hint',text:'Stel de uitfadetijd in tussen 0,5 en 60 seconden. Deze instelling wordt automatisch bewaard.'}),el('label',{text:'Naam setlijst'}),name,el('label',{text:'Open een setlijst'}),choice,el('p',{class:'hint',text:'De muzieknummers worden lokaal op dit apparaat bewaard. Synchronisatie tussen iPhone en iPad is nog niet beschikbaar. Een lange druk op een cue opent de instellingen.'}));fadeInput.onchange=()=>{fadeValue=Math.min(60,Math.max(0.5,Number(fadeInput.value)||2));fadeInput.value=fadeValue;$('fadeDuration').max=60;$('fadeDuration').value=fadeValue;$('fadeValue').textContent=fadeValue.toFixed(1);persist();toast('Fade-out ingesteld op '+fadeValue+' seconden')};
openDialog('Setlijsten en instellingen',body,[{label:'Bewaar setlijst',kind:'primary',action:()=>{setName=name.value.trim()||'Mijn setlijst';setNames[setName]=slots.map(s=>s?{name:s.name,key:s.key,volume:s.volume,start:s.start,end:s.end}:null);persist();close();toast('Setlijst bewaard')}},{label:'Open setlijst',action:()=>{const key=choice.value;if(!key)return;stop();active=-1;slots=Array.from({length:MAX},(_,i)=>setNames[key][i]||null);setName=key;persist();close();hydrate();render()}},{label:'Sluiten',action:close}])}
$('settings').onclick=settings;$('dialog').onclick=e=>{if(e.target===$('dialog'))close()};window.addEventListener('resize',()=>{page=Math.min(page,maxPage());render()});
try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved){slots=Array.from({length:MAX},(_,i)=>saved.slots?.[i]||null);setName=saved.setName||setName;setNames=saved.setNames||{};fadeValue=saved.fadeValue||2;$('fadeDuration').value=fadeValue;$('fadeValue').textContent=fadeValue.toFixed(1)}}catch(e){}
initMediaSession();render();hydrate();
</script></body></html>
