<script>

function render(){const board=$('board');board.replaceChildren();const count=perPage(),first=page*count;for(let n=0;n<count;n++){const i=first+n;if(i>=MAX)break;const s=slots[i],pad=el('button',{class:'pad'+(!s?' empty':'')+(s?.key&&(playedBySet[setName]||[]).includes(s.key)?' played':'')+(active===i&&!audio.paused?' playing':'')+(selected===i?' selected':''),'aria-label':'Cue '+(i+1)+(s?' '+s.name:' leeg')});pad.append(el('span',{class:'number',text:String(i+1)}),el('span',{class:'name',text:s?s.name:''}));if(s?.end!=null)pad.append(el('span',{class:'corner'}));if(s?.key&&(playedBySet[setName]||[]).includes(s.key))pad.append(el('span',{class:'played-label',text:'PLAYED'}));let suppressClick=false;pad.onclick=()=>{if(suppressClick){suppressClick=false;return}if(s){if(active===i&&!audio.paused){stop();return}start(i)}else editSlot(i)};pad.oncontextmenu=e=>{e.preventDefault();if(!suppressClick){suppressClick=true;editSlot(i)}};let touchTimer;pad.addEventListener('touchstart',()=>{suppressClick=false;touchTimer=setTimeout(()=>{touchTimer=null;suppressClick=true;editSlot(i)},650)},{passive:true});pad.addEventListener('touchend',()=>clearTimeout(touchTimer));pad.addEventListener('touchcancel',()=>{clearTimeout(touchTimer);suppressClick=false});pad.addEventListener('touchmove',()=>clearTimeout(touchTimer));board.append(pad)}const pages=$('pages');pages.replaceChildren();for(let p=0;p<=maxPage();p++){const b=el('button',{text:'Page '+(p+1)});if(p===page){b.className='active';b.setAttribute('aria-current','page')}b.onclick=()=>setPage(p);pages.append(b)}$('pageCount').textContent=(page+1)+' / '+(maxPage()+1);$('prevPage').disabled=page===0;$('nextPage').disabled=page===maxPage();updateClock()}

function editSlot(i){selected=i;const cue=slots[i],body=el('div');const name=el('input',{type:'text',value:cue?.name||'',placeholder:'Naam van de cue'}),vol=el('input',{type:'range',min:'0',max:'100',value:String(cue?.volume??100)}),volumeText=el('span',{text:String(cue?.volume??100)+'%'}),startAt=el('input',{type:'number',min:'0',step:'0.1',value:String(cue?.start??0)}),endAt=el('input',{type:'number',min:'0',step:'0.1',placeholder:'Volledige track'}),dest=el('input',{type:'number',min:'1',max:String(MAX),value:String(i+1)});if(cue?.end!=null)endAt.value=cue.end;vol.oninput=()=>volumeText.textContent=vol.value+'%';
for(const [label,input]of [['Cue-naam',name],['Cue-volume',vol],['Startpositie (seconden)',startAt],['Eindpositie (optioneel)',endAt],['Cue-positie',dest]]){body.append(el('label',{text:label}),input);if(input===vol)body.append(volumeText)}
body.append(el('p',{class:'hint',text:'Houd een cue ingedrukt om deze instellingen te openen. Audio kiezen vervangt alleen het audiobestand van deze cue.'}));
openDialog('Cue '+(i+1),body,[{label:'Audio kiezen',kind:'primary',action:()=>{pendingSlot=i;$('file').multiple=false;$('file').click();close()}},{label:'Opslaan',action:()=>{if(!cue){close();render();return}const target=Math.min(MAX-1,Math.max(0,Math.round(Number(dest.value)||i+1)-1));const start=Number(startAt.value),end=endAt.value.trim()===''?null:Number(endAt.value),volume=Number(vol.value);if(!Number.isFinite(start)||start<0||end!==null&&(!Number.isFinite(end)||end<=start)){toast('Controleer de start- en eindpositie');return}if(target!==i&&slots[target]&&!confirm('Cue '+(target+1)+' is bezet. Beide cues omwisselen?'))return;cue.name=name.value.trim()||cue.name;cue.volume=Math.min(100,Math.max(0,volume));cue.start=start;cue.end=end;if(target!==i){[slots[i],slots[target]]=[slots[target],slots[i]];if(active===i)active=target;else if(active===target)active=i;selected=target}if(active===target||active===i){if(!audio.paused)clearFade();applyVolume();syncMediaSession()}persist();close();render()}},{label:'Verwijder cue',kind:'danger',action:()=>{if(!slots[i]||confirm('Cue '+(i+1)+' verwijderen?')){if(active===i){stop();audio.removeAttribute('src');active=-1}if(slots[i]?.url)URL.revokeObjectURL(slots[i].url);slots[i]=null;persist();render();close()}}},{label:'Annuleren',action:close}])}
async function importFiles(files,target=-1){let n=0;for(const file of files){if(!file.type.startsWith('audio/')&&!/\.(mp3|wav|m4a|aac)$/i.test(file.name))continue;const i=target>=0?target:slots.findIndex(s=>!s);if(i<0||i>=MAX)break;const key=crypto.randomUUID(),item={name:file.name.replace(/\.[^.]+$/,''),key,url:URL.createObjectURL(file),volume:100,start:0,end:null};try{await putBlob(key,file)}catch(e){toast('Opslag mislukt: audiobestand mogelijk niet blijvend beschikbaar')}if(active===i){stop();audio.removeAttribute('src');active=-1}if(slots[i]?.url)URL.revokeObjectURL(slots[i].url);slots[i]=item;n++;if(target>=0)break}persist();render();toast(n+' audiobestand(en) toegevoegd')}

$('stop').onclick=stop;$('pause').onclick=()=>{if(audio.paused){if(active>=0&&slots[active]?.url){setupAudio();audio.play().catch(()=>toast('Kan niet hervatten'))}}else{clearFade();audio.pause()}render()};
$('fade').onclick=async()=>{if(audio.paused||active<0)return;const cue=slots[active];if(!cue?.key){toast('Fade-out niet beschikbaar: audiobestand ontbreekt');return}clearFade(false);const run=fadeRun,request=playRequest,duration=Math.max(0.5,Math.min(60,Number(fadeValue)||2));const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx){toast('Fade-out wordt niet ondersteund op dit apparaat');return}$('fade').disabled=true;let ctx;try{ctx=new AudioCtx();fadeContext=ctx;await ctx.resume();const blob=await getBlob(cue.key);if(!blob)throw Error('Audiobestand ontbreekt');const buffer=await ctx.decodeAudioData(await blob.arrayBuffer());if(run!==fadeRun||request!==playRequest||audio.paused||active<0||slots[active]!==cue)return;const source=ctx.createBufferSource(),gain=ctx.createGain();source.buffer=buffer;source.connect(gain);gain.connect(ctx.destination);fadeSource=source;const now=ctx.currentTime;gain.gain.setValueAtTime(Math.max(0,Math.min(1,(cue.volume??100)/100)),now);gain.gain.linearRampToValueAtTime(0,now+duration);const offset=Math.max(0,Math.min(audio.currentTime,buffer.duration-0.01));audio.pause();source.start(now,offset);fadeTimeout=setTimeout(()=>{if(run!==fadeRun||request!==playRequest)return;/* The native element is already paused. Do not seek or restore its volume at the fade boundary: iOS can briefly output a loud audio fragment. */playRequest++;markPlayed();clearFade(false);syncMediaSession();render();updateClock();toast('Fade-out voltooid')},duration*1000+80);toast('Fade-out gestart: '+duration+' seconden')}catch(e){if(run===fadeRun){clearFade();toast('Fade-out kon niet starten; muziek blijft behouden')}}};
