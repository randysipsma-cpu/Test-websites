<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10111b"><title>Mijn Orkestbanden</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f3ff;background:#10111b}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;background:#171825;border-bottom:1px solid #303044}.brand{font-size:22px;font-weight:800}.brand span{color:#b79aff}.muted{color:#aaa9bd}.layout{display:grid;grid-template-columns:minmax(280px,42%) 1fr;min-height:calc(100dvh - 75px)}aside{border-right:1px solid #303044;padding:18px;min-width:0}.player{padding:22px;display:flex;flex-direction:column;gap:20px;justify-content:center;max-width:800px;width:100%;margin:auto}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:15px}button{border:0;border-radius:12px;padding:12px 16px;background:#343149;color:white}button.primary{background:#8d65e4}button:focus-visible,input:focus-visible{outline:3px solid #cdb5ff}button:disabled{opacity:.45;cursor:not-allowed}input[type=text]{background:#222332;border:1px solid #45445a;border-radius:10px;color:white;padding:12px;min-width:0;flex:1}.cue{display:flex;gap:10px;align-items:center;width:100%;margin:8px 0;background:#202131;border:1px solid #343449;border-radius:13px;padding:10px;text-align:left}.cue.active{border-color:#a886ff;background:#34284c}.cue .num{background:#45405b;border-radius:9px;min-width:39px;text-align:center;padding:11px 4px}.cue .detail{flex:1;min-width:0}.cue strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cue small{color:#aaa9bd}.cue .go{background:#7551c4;padding:10px 14px}.cue .move{padding:8px}.cover{height:170px;width:170px;background:linear-gradient(135deg,#6d4ca5,#28223c);border-radius:24px;display:grid;place-items:center;font-size:70px;margin:auto}.center{text-align:center}h1{font-size:30px;margin:0}h2{font-size:20px;margin:0 0 12px}.time{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}.transport{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.transport button{font-size:19px;min-width:74px}.transport .primary{font-size:24px}.panel{background:#1c1d2a;padding:20px;border-radius:20px}.range{width:100%;accent-color:#aa85f9}.switch{display:flex;gap:8px}.switch button.selected{background:#8d65e4}.status{min-height:20px;color:#cbb4ff}.cue-list{max-height:calc(100dvh - 210px);overflow:auto}label.file{display:inline-block;background:#8d65e4;padding:12px 16px;border-radius:12px;cursor:pointer}#files{display:none}@media(max-width:740px){.layout{display:flex;flex-direction:column}aside{border-right:0;border-bottom:1px solid #303044}.cue-list{max-height:260px}.player{padding:16px}.cover{height:115px;width:115px;font-size:46px}header{padding:14px}.brand{font-size:18px}}
@media(min-width:741px){.layout{grid-template-columns:minmax(0,1fr) 340px}.cue-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));align-content:start;gap:10px;max-height:calc(100dvh - 235px)}.cue{margin:0;min-height:105px;flex-wrap:wrap}.cue .detail{flex-basis:calc(100% - 62px)}.cue .go{flex:1;font-weight:800;font-size:18px}.player{justify-content:flex-start;padding:18px;gap:12px}.cover{display:none}.player h1{font-size:22px}.panel{padding:14px}.transport button{min-width:52px;padding:10px}}@media(max-width:740px){.layout{display:flex;flex-direction:column}.player{order:0;padding:12px;gap:8px}.player .cover{display:none}.player .center h1{font-size:20px}.player .panel{padding:12px}.player .transport button{padding:10px;min-width:54px}.layout aside{order:1;padding:12px}.cue-list{max-height:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cue{margin:0;min-height:128px;display:grid;grid-template-columns:36px 1fr;gap:6px;padding:8px}.cue .num{min-width:0;padding:8px 2px}.cue .detail{min-width:0}.cue .go{grid-column:1/3;font-size:17px;font-weight:800;padding:10px}.cue .move{padding:6px}.cue .detail strong{font-size:13px}.cue .detail small{font-size:11px}.bar{gap:6px}.bar button,.bar label.file{padding:10px}.player>p.muted{display:none}}@media(max-width:360px){.cue-list{grid-template-columns:1fr}}.cue.playing{border-color:#40d7a1;background:#173d39;box-shadow:inset 0 0 0 1px #40d7a1}.cue.playing .go{background:#087f62}.cue .go:focus-visible{outline:3px solid #fff}</style></head><body><header><div class="brand">♫ Mijn <span>Orkestbanden</span></div><div class="switch"><button id="live" class="selected">Live</button><button id="practice">Oefenen</button></div></header><main class="layout"><aside><h2>Mijn cues <span id="count" class="muted"></span></h2><div class="bar"><input id="setname" type="text" placeholder="Naam setlijst" aria-label="Naam setlijst"><button id="saveset">Bewaar setlijst</button><select id="setlists" aria-label="Opgeslagen setlijsten"><option value="">Kies setlijst</option></select></div><div class="bar"><label class="file" for="files">+ Voeg muziek toe</label><input type="file" id="files" accept="audio/*,.mp3,.wav,.m4a,.aac" multiple></div><div class="bar"><input id="search" type="text" placeholder="Zoek een orkestband..."><button id="clear">Wis lijst</button></div><div id="cues" class="cue-list"></div></aside><section class="player"><div class="cover" aria-hidden="true">♫</div><div class="center"><p class="muted" id="label">Geselecteerde cue</p><h1 id="title">Nog geen orkestband</h1><p class="muted" id="subtitle">Importeer je eigen audiobestanden</p></div><div class="panel"><input class="range" type="range" min="0" max="1000" value="0" id="seek" aria-label="Afspeelpositie"><div class="time"><span id="elapsed">00:00</span><span id="remaining">-00:00</span></div><div class="transport"><button id="previous" aria-label="Vorige cue">⏮</button><button id="play" class="primary">▶</button><button id="pause">⏸</button><button id="stop">■ Stop</button><button id="next" aria-label="Volgende cue">⏭</button></div><div class="bar" style="justify-content:center;margin:18px 0 0"><label class="muted" for="cuevolume">Cue-volume</label><input id="cuevolume" type="range" min="0" max="100" value="100" aria-label="Cue-volume"><label class="muted" for="cuestart">Start (sec)</label><input id="cuestart" type="number" min="0" step="1" value="0" style="width:76px;background:#28283b;color:white;border:1px solid #555;border-radius:8px;padding:8px"><label class="muted" for="cueend">Eind (sec)</label><input id="cueend" type="number" min="0" step="1" placeholder="Einde" style="width:76px;background:#28283b;color:white;border:1px solid #555;border-radius:8px;padding:8px"><button id="fade">Fade-out 3s</button><label class="muted" for="volume">Volume</label><input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume"><label class="muted" for="speed">Snelheid</label><select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></div><p class="status center" id="status" role="status"></p></div><p class="muted center">Live-modus: na elk nummer stopt de speler. Volgende cue start nooit vanzelf.</p></section></main><audio id="audio" preload="metadata"></audio><script>
'use strict';
const $=id=>document.getElementById(id),audio=$('audio');let tracks=[],selected=-1,mode='live',fadeTimer=null;const storeKey='mijn-orkestbanden-sets-v1';const MAX=125;
const fmt=s=>{if(!Number.isFinite(s))return '00:00';s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function status(s){$('status').textContent=s}
function clearFade(){if(fadeTimer){clearInterval(fadeTimer);fadeTimer=null}applyVolume()}function applyVolume(){audio.volume=Number($('volume').value)/100*(selected>=0?(tracks[selected].volume??100)/100:1)}
function select(i){if(i<0||i>=tracks.length)return;clearFade();audio.pause();selected=i;audio.src=tracks[i].url;audio.load();$('cuevolume').value=tracks[i].volume??100;$('cuestart').value=tracks[i].start??0;$('cueend').value=tracks[i].end??'';audio.onloadedmetadata=()=>{audio.currentTime=Math.min(Number(tracks[i].start||0),audio.duration||0);updateTime()};applyVolume();$('title').textContent=tracks[i].name;$('subtitle').textContent='Cue '+(i+1);$('label').textContent='Geselecteerde cue';$('seek').value=0;updateTime();render()}
async function play(i=selected){if(i<0){status('Voeg eerst een orkestband toe.');return}if(!tracks[i].url){status('Audiobestand ontbreekt: importeer dit nummer opnieuw.');return}if(i!==selected)select(i);clearFade();try{await audio.play();render();status('Afspelen: '+tracks[selected].name)}catch(e){status('Afspelen mislukt. Tik opnieuw op Play of controleer het audiobestand.')}}
function stop(){clearFade();audio.pause();if(Number.isFinite(audio.duration))audio.currentTime=Math.min(Number(tracks[selected]?.start||0),audio.duration);status('Gestopt');render()}
function updateTime(){if(selected>=0&&tracks[selected].end&&audio.currentTime>=Number(tracks[selected].end)&&!audio.paused){stop();status('Cue-eindpunt bereikt');return}$('elapsed').textContent=fmt(audio.currentTime);$('remaining').textContent='-'+fmt((audio.duration||0)-audio.currentTime);$('seek').value=audio.duration?Math.round(audio.currentTime/audio.duration*1000):0}
function render(){const root=$('cues');root.replaceChildren();$('count').textContent='('+tracks.length+'/'+MAX+')';const q=$('search').value.toLowerCase();tracks.forEach((t,i)=>{if(!t.name.toLowerCase().includes(q))return;const row=document.createElement('div');row.className='cue'+(selected===i?' active':'')+(selected===i&&!audio.paused?' playing':'');const num=document.createElement('span');num.className='num';num.textContent=i+1;const info=document.createElement('button');info.className='detail';info.style.cssText='background:none;text-align:left;padding:0';const strong=document.createElement('strong');strong.textContent=t.name;const small=document.createElement('small');small.textContent='Selecteer cue';info.append(strong,small);info.onclick=()=>select(i);const go=document.createElement('button');go.className='go';go.textContent=selected===i&&!audio.paused?'■ STOP':'▶ START';go.setAttribute('aria-label','Speel '+t.name);go.onclick=()=>{if(selected===i&&!audio.paused)stop();else play(i)};const up=document.createElement('button');up.className='move';up.textContent='↑';up.disabled=i===0;up.setAttribute('aria-label','Verplaats omhoog');up.onclick=()=>move(i,-1);const down=document.createElement('button');down.className='move';down.textContent='↓';down.disabled=i===tracks.length-1;down.setAttribute('aria-label','Verplaats omlaag');down.onclick=()=>move(i,1);row.append(num,info,go,up,down);root.append(row)})}
function move(i,d){const j=i+d;if(j<0||j>=tracks.length)return;[tracks[i],tracks[j]]=[tracks[j],tracks[i]];if(selected===i)selected=j;else if(selected===j)selected=i;render()}
$('files').onchange=e=>{const files=Array.from(e.target.files);let added=0;for(const f of files){if(tracks.length>=MAX)break;if(!f.type.startsWith('audio/')&&!/\.(mp3|wav|m4a|aac)$/i.test(f.name))continue;tracks.push({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f),volume:100,start:0,end:null});added++}if(selected<0&&tracks.length)select(0);render();status(added+' orkestband(en) toegevoegd. Bestanden blijven alleen in deze browsersessie beschikbaar.');e.target.value=''};
$('search').oninput=render;$('clear').onclick=()=>{if(!confirm('Alle cues uit deze sessie verwijderen?'))return;stop();audio.removeAttribute('src');audio.load();tracks.forEach(t=>URL.revokeObjectURL(t.url));tracks=[];selected=-1;$('title').textContent='Nog geen orkestband';$('subtitle').textContent='Importeer je eigen audiobestanden';render();status('Cue-lijst gewist')};
$('play').onclick=()=>play();$('pause').onclick=()=>{audio.pause();status('Gepauzeerd')};$('stop').onclick=stop;
$('previous').onclick=()=>select(Math.max(0,selected-1));$('next').onclick=()=>select(Math.min(tracks.length-1,selected+1));
$('seek').oninput=e=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(e.target.value)/1000*audio.duration};
$('volume').oninput=e=>{if(!fadeTimer)applyVolume()};
$('speed').onchange=e=>audio.playbackRate=Number(e.target.value);
$('fade').onclick=()=>{if(audio.paused)return;clearFade();const start=audio.volume,t0=performance.now();fadeTimer=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/3000);audio.volume=Math.max(0,start*(1-p));if(p>=1){stop();status('Fade-out voltooid')}},50)};
audio.onplay=render;audio.onpause=render;audio.ontimeupdate=updateTime;audio.onended=()=>{clearFade();status('Cue afgelopen – klaar voor de volgende')};audio.onerror=()=>status('Kan dit audiobestand niet afspelen.');
$('cuevolume').oninput=e=>{if(selected>=0){tracks[selected].volume=Number(e.target.value);applyVolume()}};$('cuestart').onchange=e=>{if(selected>=0){tracks[selected].start=Math.max(0,Number(e.target.value)||0)}};$('cueend').onchange=e=>{if(selected>=0){tracks[selected].end=e.target.value===''?null:Math.max(0,Number(e.target.value)||0)}};
function refreshSets(){const sets=JSON.parse(localStorage.getItem(storeKey)||'{}');$('setlists').replaceChildren(new Option('Kies setlijst',''));Object.keys(sets).sort().forEach(n=>$('setlists').add(new Option(n,n)))}
$('saveset').onclick=()=>{const name=$('setname').value.trim();if(!name){status('Vul eerst een naam voor de setlijst in');return}const sets=JSON.parse(localStorage.getItem(storeKey)||'{}');sets[name]=tracks.map(t=>({name:t.name,volume:t.volume??100,start:t.start??0,end:t.end??null}));try{localStorage.setItem(storeKey,JSON.stringify(sets));refreshSets();$('setlists').value=name;status('Setlijst bewaard. Audiobestanden moet je na heropenen opnieuw koppelen.')}catch(e){status('Opslaan mislukt: browseropslag niet beschikbaar')}};
$('setlists').onchange=e=>{const name=e.target.value;if(!name)return;const sets=JSON.parse(localStorage.getItem(storeKey)||'{}');const data=sets[name]||[];stop();tracks.forEach(t=>URL.revokeObjectURL(t.url));tracks=data.map(t=>({...t,url:''}));selected=-1;$('title').textContent='Selecteer een cue';$('setname').value=name;render();status('Setlijst geladen. Importeer de audiobestanden opnieuw voordat je afspeelt.')};
function setMode(m){mode=m;$('live').classList.toggle('selected',m==='live');$('practice').classList.toggle('selected',m==='practice');$('speed').disabled=m==='live';if(m==='live'){$('speed').value='1';audio.playbackRate=1}status(m==='live'?'Live-modus ingeschakeld':'Oefenmodus ingeschakeld')}
$('live').onclick=()=>setMode('live');$('practice').onclick=()=>setMode('practice');setMode('live');refreshSets();render();
</script></body></html>
