<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><title>MyHub</title><link rel="manifest" href="./manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc}.wrap{max-width:720px;margin:auto;padding:28px 18px 80px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:38px;margin:12px 0 4px}p{color:#9ca3af}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button,input,select{font:inherit;border-radius:12px;padding:12px;border:1px solid #475569;background:#1e293b;color:inherit}button{cursor:pointer}button.primary{background:#38bdf8;color:#082f49;border:0;font-weight:700}input{width:100%}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{background:#172338;border:1px solid #334155;border-radius:20px;padding:15px 8px;text-align:center;min-width:0}.emoji{font-size:36px;display:block;margin-bottom:8px}.name{display:block;font-size:13px;overflow-wrap:anywhere}.mini{font-size:11px;padding:5px 7px;margin-top:9px}dialog{background:#111827;color:#fff;border:1px solid #475569;border-radius:18px;width:min(92vw,420px)}dialog form{display:grid;gap:10px}label{font-size:13px;color:#cbd5e1}small{color:#94a3b8}.light{color-scheme:light}body.light{background:#f1f5f9;color:#0f172a}body.light .tile{background:white;color:#0f172a}body.light button,body.light input,body.light select{background:#fff;color:#0f172a}body.light dialog{background:#fff;color:#0f172a}@media(max-width:370px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><header><strong>✨ MyHub</strong><button id="theme" aria-label="Wissel thema">◐</button></header><h1>Mijn apps</h1><p>Je favoriete apps en websites op één plek.</p><div class="toolbar"><button class="primary" id="add">＋ Toevoegen</button><select id="filter" aria-label="Categorie"><option>Alles</option><option>Zakelijk</option><option>Privé</option><option>Entertainment</option><option>Overig</option></select></div><section id="grid" class="grid"></section><p><small>Links openen alleen wanneer de betreffende app of website dit ondersteunt. Gegevens blijven op dit apparaat.</small></p></main><dialog id="dialog"><form id="form"><h2 id="heading">Snelkoppeling</h2><input type="hidden" id="edit"><label>Naam<input id="name" maxlength="35" required placeholder="Bijvoorbeeld WhatsApp"></label><label>Website of app-link<input id="url" required placeholder="https://voorbeeld.nl"></label><label>Icoon (emoji)<input id="emoji" maxlength="8" value="🔗"></label><label>Categorie<select id="category"><option>Privé</option><option>Zakelijk</option><option>Entertainment</option><option>Overig</option></select></label><label><input type="checkbox" id="favorite" style="width:auto"> Favoriet</label><div style="display:flex;gap:8px"><button class="primary" type="submit">Opslaan</button><button type="button" id="cancel">Annuleren</button><button type="button" id="remove">Verwijderen</button></div></form></dialog><script>const key='myhub-links-v1',defaults=[{id:'hpm',name:'HPM Boekhouding',url:'https://hpm.randysipsma.workers.dev/',emoji:'🧾',category:'Zakelijk',favorite:true},{id:'casa',name:'Casa Vivi',url:'https://casavivi.eu/',emoji:'🏡',category:'Zakelijk',favorite:false},{id:'github',name:'GitHub',url:'https://github.com/',emoji:'💻',category:'Zakelijk',favorite:false}];let items;try{const x=JSON.parse(localStorage.getItem(key));items=Array.isArray(x)?x:defaults}catch{items=defaults}const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(items))}function valid(u){try{const p=new URL(u);return ['https:','http:','mailto:','tel:','whatsapp:','spotify:'].includes(p.protocol)}catch{return false}}function render(){const g=$('grid');g.replaceChildren();items.filter(x=>$('filter').value==='Alles'||x.category===$('filter').value).sort((a,b)=>Number(!!b.favorite)-Number(!!a.favorite)).forEach(x=>{const tile=document.createElement('div');tile.className='tile';const a=document.createElement('a');a.style.cssText='color:inherit;text-decoration:none;display:block';a.href=valid(x.url)?x.url:'#';a.rel='noopener noreferrer';const e=document.createElement('span');e.className='emoji';e.textContent=x.emoji||'🔗';const n=document.createElement('span');n.className='name';n.textContent=(x.favorite?'★ ':'')+x.name;a.append(e,n);const b=document.createElement('button');b.className='mini';b.textContent='Bewerken';b.addEventListener('click',()=>edit(x));tile.append(a,b);g.append(tile)})}function edit(x){$('form').reset();$('edit').value=x?.id||'';$('name').value=x?.name||'';$('url').value=x?.url||'';$('emoji').value=x?.emoji||'🔗';$('category').value=x?.category||'Privé';$('favorite').checked=!!x?.favorite;$('remove').hidden=!x;$('dialog').showModal()}$('add').onclick=()=>edit(null);$('cancel').onclick=()=>$('dialog').close();$('filter').onchange=render;$('form').onsubmit=e=>{e.preventDefault();const url=$('url').value.trim();if(!valid(url)){alert('Gebruik een geldige https://-link of ondersteunde app-link.');return}const id=$('edit').value||String(Date.now());const item={id,name:$('name').value.trim(),url,emoji:$('emoji').value||'🔗',category:$('category').value,favorite:$('favorite').checked};items=items.filter(x=>x.id!==id).concat(item);save();render();$('dialog').close()};$('remove').onclick=()=>{if(confirm('Snelkoppeling verwijderen?')){items=items.filter(x=>x.id!==$('edit').value);save();render();$('dialog').close()}};$('theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('myhub-theme',document.body.classList.contains('light')?'light':'dark')};if(localStorage.getItem('myhub-theme')==='light')document.body.classList.add('light');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();</script></body></html>
