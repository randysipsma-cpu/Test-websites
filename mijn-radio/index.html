<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><title>Mijn Radio</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#f8fafc;background:#090d19}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);max-width:620px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:22px 0}h1{font-size:25px;margin:0}button,input{font:inherit}button{border:0;cursor:pointer;color:inherit;background:#222b42;border-radius:14px;padding:12px}button:focus-visible,input:focus-visible{outline:2px solid #8a7dff}.player{background:linear-gradient(145deg,#34306c,#121d34);border-radius:26px;padding:28px 20px;text-align:center;box-shadow:0 18px 45px #0005}.art{font-size:65px;margin:15px}.muted{color:#a8b4ce;font-size:13px}.name{font-size:27px;font-weight:750;margin:12px}.controls{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:22px}.controls button{font-size:24px}.controls #play{background:#8176ff;border-radius:50%;width:65px;height:65px}.toolbar{display:flex;gap:8px;margin:24px 0 14px}.toolbar input{flex:1;min-width:0}.toolbar button{white-space:nowrap}input{background:#1b2437;color:white;border:1px solid #3a455e;padding:13px;border-radius:12px}h2{font-size:18px}.station{display:flex;align-items:center;gap:12px;background:#151d2e;border:1px solid #27314a;border-radius:16px;padding:12px;margin:9px 0}.station .logo{width:45px;height:45px;border-radius:12px;object-fit:cover;background:#2c3450}.station .meta{flex:1;min-width:0}.station .meta strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.station button{padding:9px}.station .star{color:#f8c75b}.modal{background:#141e30;border:1px solid #45516a;border-radius:20px;padding:18px;margin:12px 0}.modal input{display:block;width:100%;margin:10px 0}.hidden{display:none}.error{color:#ffaaa9;min-height:20px}footer{padding:30px 0;color:#8290ad;text-align:center;font-size:12px}</style></head><body>
<header><h1>📻 Mijn Radio</h1><button id="add">＋ Zender</button></header><section class="player"><div class="muted">NU AAN HET AFSPELEN</div><div class="art">📡</div><div class="name" id="current">Kies een zender</div><div class="muted" id="status">Klaar om te luisteren</div><div class="controls"><button id="prev" aria-label="Vorige zender">⏮</button><button id="play" aria-label="Afspelen of pauzeren">▶</button><button id="next" aria-label="Volgende zender">⏭</button></div></section>
<div class="toolbar"><input id="search" placeholder="Zoek Nederlandse radiozenders" aria-label="Zoeken"><button id="find">Zoeken</button></div><div id="form" class="modal hidden"><h2>Eigen SHOUTcast toevoegen</h2><input id="customName" placeholder="Naam van de zender"><input id="customUrl" type="url" placeholder="https://... stream URL"><button id="save">Opslaan</button> <button id="cancel">Annuleren</button></div><p id="error" class="error" role="status"></p><h2>⭐ Favorieten en eigen zenders</h2><div id="saved"></div><h2>🔎 Radiozenders ontdekken</h2><div id="results"><p class="muted">Zoek een zender om deze te beluisteren of toe te voegen.</p></div><footer>Mijn Radio · iPhone-versie</footer><audio id="audio" preload="none"></audio>
<script>
const $=id=>document.getElementById(id), audio=$('audio');let stations=JSON.parse(localStorage.getItem('mijn-radio-stations')||'[]'),active=-1,results=[];const persist=()=>localStorage.setItem('mijn-radio-stations',JSON.stringify(stations));const safeUrl=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}};const node=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e};
function renderList(target,items,saved){target.replaceChildren();if(!items.length){target.append(node('p','muted',saved?'Nog geen favorieten. Zoek of voeg een zender toe.':'Geen resultaten.'));return}items.forEach((s,i)=>{const row=node('div','station'),logo=node('div','logo');logo.textContent='📻';logo.style.display='grid';logo.style.placeItems='center';if(s.favicon&&safeUrl(s.favicon)){const im=node('img','logo');im.src=s.favicon;im.alt='';im.onerror=()=>im.replaceWith(logo);row.append(im)}else row.append(logo);const meta=node('div','meta');meta.append(node('strong','',s.name),node('small','muted',s.country|| (s.custom?'Eigen SHOUTcast':'Internet radio')));row.append(meta);const listen=node('button','','▶');listen.setAttribute('aria-label','Speel '+s.name);listen.onclick=()=>start(s,saved?i:-1);row.append(listen);const star=node('button','star',saved?'✕':'☆');star.setAttribute('aria-label',saved?'Verwijder '+s.name:'Bewaar '+s.name);star.onclick=()=>{if(saved){stations.splice(i,1);if(active===i){audio.pause();active=-1;$('current').textContent='Kies een zender'}else if(active>i)active--; }else if(!stations.some(x=>x.url===s.url)){stations.push(s)}persist();render()};row.append(star);target.append(row)})}
function render(){renderList($('saved'),stations,true);renderList($('results'),results,false)}
async function start(s,index){const url=safeUrl(s.url);if(!url){$('error').textContent='Geen geldig streamadres';return}active=index;$('current').textContent=s.name;$('status').textContent='Verbinden…';$('error').textContent='';audio.src=url;try{await audio.play();$('play').textContent='⏸';$('status').textContent='Live radio';if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:'Mijn Radio'});navigator.mediaSession.setActionHandler('play',()=>audio.play());navigator.mediaSession.setActionHandler('pause',()=>audio.pause())}}catch{$('status').textContent='Afspelen niet mogelijk';$('error').textContent='Deze stream is mogelijk niet compatibel met Safari of blokkeert externe spelers.'}}
$('play').onclick=async()=>{if(!audio.src)return;if(audio.paused){try{await audio.play()}catch{$('error').textContent='Afspelen mislukt'}}else audio.pause()};audio.onplay=()=>{$('play').textContent='⏸';$('status').textContent='Live radio'};audio.onpause=()=>{$('play').textContent='▶';$('status').textContent='Gepauzeerd'};audio.onerror=()=>{$('status').textContent='Streamfout';$('error').textContent='Controleer de stream-URL en iPhone-compatibiliteit.'};function step(d){if(!stations.length)return;const i=(active+d+stations.length)%stations.length;start(stations[i],i)}$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('add').onclick=()=>$('form').classList.remove('hidden');$('cancel').onclick=()=>$('form').classList.add('hidden');$('save').onclick=()=>{const name=$('customName').value.trim(),url=safeUrl($('customUrl').value.trim());if(!name||!url){$('error').textContent='Vul een naam en geldig http(s)-streamadres in.';return}stations.push({name,url,custom:true});persist();render();$('form').classList.add('hidden');$('customName').value='';$('customUrl').value='';$('error').textContent=''};
async function search(){const q=$('search').value.trim();if(!q)return;$('results').textContent='Zoeken…';$('error').textContent='';try{const resp=await fetch('https://de1.api.radio-browser.info/json/stations/search?name='+encodeURIComponent(q)+'&countrycode=NL&hidebroken=true&limit=30&order=votes&reverse=true',{headers:{'User-Agent':'MijnRadioWeb/1.0'}});if(!resp.ok)throw Error('catalogus');const data=await resp.json();results=data.filter(s=>safeUrl(s.url_resolved||s.url)).map(s=>({name:s.name.trim(),url:s.url_resolved||s.url,favicon:s.favicon,country:s.country}));render()}catch{$('results').replaceChildren();$('error').textContent='De online zendercatalogus is momenteel niet bereikbaar.'}}$('find').onclick=search;$('search').onkeydown=e=>{if(e.key==='Enter')search()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
